name: gasto_familiar
description: "Aplicativo de controle financeiro familiar"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  intl: ^0.19.0
  file_picker: ^8.1.2
  file_saver: ^0.2.8  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.3.9"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/icon/screen.png

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false

flutter_native_splash:
  color: "FAF6EE"
  image: "assets/icon/screen.png"
  android: true
  ios: false
  
