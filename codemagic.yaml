workflows:
  android-release:
    name: Android Release Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      vars:
        PACKAGE_NAME: "com.example.gasto_familiar"
    scripts:
      - name: Generate Android platform files if missing
        script: |
          # Se a pasta android não existir, o Flutter cria-a automaticamente
          flutter create . --platforms=android
          
      - name: Restore keystore and google-services.json
        script: |
          mkdir -p android/app
          
          # Descodifica a keystore base64 para o local correto
          echo "$CM_KEYSTORE_BASE_64" | base64 --decode > android/app/nova_chave.jks
          
          # Injeta o google-services.json atualizado
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          
      - name: Configure signing properties
        script: |
          cat << EOF > android/key.properties
          storePassword=Luc07@gasto_familiar
          keyPassword=Luc07@gasto_familiar
          keyAlias=gasto_familiar2026
          storeFile=nova_chave.jks
          EOF
          
      - name: Get Flutter packages
        script: |
          flutter pub get
          
      - name: Build signed APK
        script: |
          flutter build apk --release
          
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
