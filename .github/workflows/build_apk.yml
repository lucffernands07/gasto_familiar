name: Compilar APK e Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      # --- CRIAR PLATAFORMA ANDROID TEMPORÁRIA E AJUSTAR SDK PARA 36 ---
      - name: Habilitar plataforma Android e ajustar SDK
        run: |
          flutter create . --platforms android
          # Atualiza automaticamente o compileSdk e targetSdk para 36 no build.gradle gerado
          sed -i 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk [0-9]*/targetSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle || true

      # Gerar ícone e splash screen
      - name: Gerar icone da aplicacao
        run: dart run flutter_launcher_icons

      - name: Gerar ecra de abertura (Splash Screen)
        run: dart run flutter_native_splash:create

      # --- GERAR BUILD WEB PARA O GITHUB PAGES ---
      - name: Habilitar plataforma Web
        run: flutter create . --platforms web

      - name: Gerar Web (Release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publicar no GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      # --- GERAR BUILD ANDROID (APK) ---
      - name: Gerar APK (Release)
        run: flutter build apk --release

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-familia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
