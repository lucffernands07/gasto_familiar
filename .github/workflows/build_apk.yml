name: Compilar APK e Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      # --- 1. GERAR BUILD WEB PRIMEIRO (TOTALMENTE ISOLADO) ---
      - name: Habilitar plataforma Web
        run: flutter create . --platforms web

      - name: Gerar Web (Release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publicar no GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      # --- 2. GERAR ANDROID, INJETAR GOOGLE-SERVICES E ASSINAR ---
      - name: Habilitar plataforma Android e ajustar dependencias nativas
        run: |
          flutter create . --platforms android
          # Injeta o google-services.json a partir do Secret
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          
          sed -i 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk [0-9]*/targetSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Gerar icone da aplicacao
        run: dart run flutter_launcher_icons

      - name: Gerar ecra de abertura (Splash Screen)
        run: dart run flutter_native_splash:create

      # --- GERAR KEYSTORE FIXA E COMPILAR EM MODO DEBUG (ASSINADO) ---
      - name: Configurar Keystore e Compilar APK
        run: |
          # Cria a keystore com parâmetros 100% estáticos (gera sempre a mesma SHA-1)
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          
          # Compila o APK em modo debug (que obrigatoriamente usa a debug.keystore acima)
          flutter build apk --debug
          
          # Copia para o caminho de release para manter o nome do artefato
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Exibir SHA-1 do APK nos Logs (Validação)
        run: |
          echo "=== EXTRACAO DA ASSINATURA DO APK ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android
          echo "====================================="

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-familia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
