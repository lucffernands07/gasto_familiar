name: Compilar APK e Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      # --- 1. GERAR BUILD WEB PRIMEIRO (TOTALMENTE ISOLADO) ---
      - name: Habilitar plataforma Web
        run: flutter create . --platforms web

      - name: Gerar Web (Release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publicar no GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      # --- 2. GERAR ANDROID, INJETAR GOOGLE-SERVICES E ASSINAR ---
      - name: Habilitar plataforma Android e ajustar dependencias nativas
        run: |
          flutter create . --platforms android
          # Injeta o google-services.json a partir do Secret
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          
          sed -i 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk [0-9]*/targetSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Gerar icone da aplicacao
        run: dart run flutter_launcher_icons

      - name: Gerar ecra de abertura (Splash Screen)
        run: dart run flutter_native_splash:create

      # --- GERAR KEYSTORE FIXA E COMPILAR APK ASSINADO ---
      - name: Configurar Keystore e Compilar APK
        run: |
          # Cria a pasta android/app se não existir
          mkdir -p android/app
          
          # Gera a keystore fixa com os dados que definiste
          keytool -genkey -v -keystore android/app/upload-keystore.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias gasto_famiar2026 \
          -keypass 'Luc07@gasto_familiar' \
          -storepass 'Luc07@gasto_familiar' \
          -dname "CN=Luciano, O=GastoFamiliar, C=BR"

          # Cria o arquivo key.properties automaticamente
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=Luc07@gasto_familiar" >> android/key.properties
          echo "keyAlias=gasto_famiar2026" >> android/key.properties
          echo "keyPassword=Luc07@gasto_familiar" >> android/key.properties

          # Compila o APK em modo release oficial utilizando a keystore fixa
          flutter build apk --release

      - name: Exibir SHA-1 do APK nos Logs (Validação)
        run: |
          echo "=== EXTRACAO DA ASSINATURA DO APK ==="
          keytool -list -v -keystore android/app/upload-keystore.jks -alias gasto_famiar2026 -storepass 'Luc07@gasto_familiar'
          echo "====================================="

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-familia-apk
          path: build/app/outputs/flutter-apk/app-release.apk


      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-familia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
