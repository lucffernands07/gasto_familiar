name: Compilar APK e Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      # --- 1. GERAR BUILD WEB PRIMEIRO (TOTALMENTE ISOLADO) ---
      - name: Habilitar plataforma Web
        run: flutter create . --platforms web

      - name: Gerar Web (Release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Publicar no GitHub Pages
        uses: PeaceIris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

      # --- 2. GERAR ANDROID, ÍCONES E APK DEPOIS ---
      - name: Habilitar plataforma Android e ajustar dependencias nativas
        run: |
          flutter create . --platforms android
          sed -i 's/compileSdk [0-9]*/compileSdk 36/g' android/app/build.gradle || true
          sed -i 's/targetSdk [0-9]*/targetSdk 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/distributionUrl=.*$/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-9.3.1-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties || true

      - name: Gerar icone da aplicacao
        run: dart run flutter_launcher_icons

      - name: Gerar ecra de abertura (Splash Screen)
        run: dart run flutter_native_splash:create

      - name: Gerar APK (Release)
        run: flutter build apk --release

      # --- 3. EXTRAIR E EXIBIR A SHA-1 NOS LOGS ---
      - name: Exibir SHA-1 do APK nos Logs
        run: |
          echo "=== EXTRACAO DA ASSINATURA DO APK ==="
          # Usa o keytool diretamente no APK ou localiza a keystore de debug padrão do Android
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            # Tenta extrair usando o apksigner do Android SDK se disponível, ou keytool se assinado
            unzip -q build/app/outputs/flutter-apk/app-release.apk -d temp_apk
            if [ -f "temp_apk/META-INF/CERT.RSA" ]; then
              keytool -printcert -file temp_apk/META-INF/CERT.RSA
            elif [ -f "temp_apk/META-INF/CERT.SF" ]; then
              keytool -printcert -file temp_apk/META-INF/CERT.SF
            else
              echo "APK nao possui certificado de release embutido (assinado com chave de debug do Gradle)."
              # Localiza e imprime o SHA-1 da chave de debug padrão do runner do GitHub
              keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || true
            fi
            rm -rf temp_apk
          else
            echo "APK nao encontrado!"
          fi
          echo "====================================="


      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-familia-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
